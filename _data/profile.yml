short_bio: >-
  <p>
    Hi! I'm Joel, a PhD student in the <a href="https://lti.cs.cmu.edu/">Language Technologies Institute</a> at Carnegie Mellon University, advised by <a href="https://maartensap.com/">Maarten Sap</a>.
  </p>

  <p>
    My research spans natural language processing, computational social science, and cultural analytics.
  </p>


  <p style="margin-bottom: 0;">
    Recent projects include:
  </p>
  <ul style="margin-top: 0;">
    <li>Modeling social and structural aspects of narrative discourse in social media</li>
    <li>Evaluating robustness of deep learning models to linguistic variation, such as dialect</li>
    <li>Examining how people conceptualize language models and negotiate boundaries for acceptable use and personalization</li>
  </ul>

  <p>
    Currently, I'm exploring computational models of textual interpretation, with particular focus on contextual reasoning and variation across individuals and groups.
  </p>

  <p>
    I have an M.S. in Language Technologies from CMU and a B.S. in Computer Science and English from Duke University, where I was advised by <a href="https://scholars.duke.edu/person/aarthi.vadde">Aarthi Vadde</a>. I also previously worked as a software engineer at Amazon Web Services.
  </p>

